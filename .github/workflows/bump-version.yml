name: Bump version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip the commit this workflow pushes (and anything explicitly marked to skip).
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip version]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Increment version
        id: bump
        run: |
          # Edits package.json and package-lock.json only; no install needed.
          # The podspec reads its version from package.json.
          npm version "${{ inputs.release || 'patch' }}" --no-git-tag-version --ignore-scripts
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
